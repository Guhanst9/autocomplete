reproduce_command: >-
  /opt/anaconda3/bin/python run_plastid.py
  --fasta_file data/plastid/refseq_full/refseq_plastids_all.fna.gz
  --output_dir outputs/s4d_base_16.69m_legacy/checkpoints
  --l_max 1024
  --max_records 15234
  --windows_per_record 4
  --max_windows 60000
  --batch_size 2
  --epochs 10
  --d_model 448
  --d_state 64
  --n_layers 10
  --lr 3e-4
  --prompt_length 500
  --generate_length 500
  --temperature 0.7
  --top_k 4
  --repetition_penalty 1.25
  --no_repeat_ngram_size 8

notes:
  - best checkpoint is epoch 6 because the run did not finish all 10 planned epochs
